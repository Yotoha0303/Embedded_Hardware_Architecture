<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
      .box-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .flow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #2563eb; }
      .arrow { stroke: #3b82f6; stroke-width: 2; fill: none; stroke-dasharray: 4,4; marker-end: url(#arrowhead); }
      .arrow-solid { stroke: #0284c7; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-solid); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
    <marker id="arrowhead-solid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8fafc" rx="12" />

  <!-- Header Section -->
  <g transform="translate(50, 40)">
    <text x="0" y="24" class="title" font-size="22">Omarchy 嵌入式硬件与 IoT 架构全景工程图</text>
    <text x="0" y="48" class="subtitle">基于 Arch Linux + Hyprland 的 ESP32-S3 全链路一体化开发、遥测与图形化工作流</text>
  </g>

  <!-- Layer 1: Omarchy Host Environment -->
  <g transform="translate(50, 110)">
    <rect width="1100" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="1100" height="32" rx="10" fill="#e2e8f0" />
    <text x="20" y="21" class="box-label">层级 1: Omarchy 宿主环境与开发者桌面工作区 (Host &amp; Hyprland Desktop)</text>
    <rect x="940" y="6" width="140" height="20" rx="4" fill="#0284c7" />
    <text x="1010" y="20" text-anchor="middle" class="badge-text">Wayland Native</text>

    <!-- Cards -->
    <g transform="translate(20, 45)">
      <rect width="250" height="75" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="15" y="24" class="card-title">💻 VS Code (ESP-IDF 插件)</text>
      <text x="15" y="44" class="card-desc">C/C++ IntelliSense / GDB 调试</text>
      <text x="15" y="60" class="card-desc">Ctrl+Shift+B 一键编译烧录</text>
    </g>

    <g transform="translate(290, 45)">
      <rect width="250" height="75" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="15" y="24" class="card-title">📊 VOFA+ 串口示波器</text>
      <text x="15" y="44" class="card-desc">FireWater / RawData 多通道波形</text>
      <text x="15" y="60" class="card-desc">Hyprland 自动浮动窗口规则支持</text>
    </g>

    <g transform="translate(560, 45)">
      <rect width="250" height="75" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="15" y="24" class="card-title">🎨 SquareLine Studio / LVGL</text>
      <text x="15" y="44" class="card-desc">拖拽式嵌入式 UI 设计器</text>
      <text x="15" y="60" class="card-desc">一键导出 C 代码到 starter 工程</text>
    </g>

    <g transform="translate(830, 45)">
      <rect width="250" height="75" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="15" y="24" class="card-title">🚀 start.sh / clean.sh</text>
      <text x="15" y="44" class="card-desc">一键拉起环境 / 自动冒烟测试</text>
      <text x="15" y="60" class="card-desc">生命周期闭环清理 / 零残留</text>
    </g>
  </g>

  <!-- Layer 2 & 3: udev Permissions & Toolchain Runtime -->
  <g transform="translate(50, 275)">
    <!-- udev Layer -->
    <rect width="400" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="400" height="32" rx="10" fill="#e0e7ff" />
    <text x="20" y="21" class="box-label" fill="#3730a3">层级 2: udev 设备免提权总线</text>

    <g transform="translate(20, 45)">
      <rect width="360" height="165" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
      <text x="15" y="25" class="card-title">📄 99-esp32-hardware.rules</text>
      <text x="15" y="50" class="card-desc">▪ 乐鑫原生 USB-JTAG/CDC (303a:1001/1002)</text>
      <text x="15" y="72" class="card-desc">▪ 南京沁恒 CH340/CH341 (1a86:7523/55d4)</text>
      <text x="15" y="94" class="card-desc">▪ Silicon Labs CP210x (10c4:ea60)</text>
      <text x="15" y="116" class="card-desc">▪ FTDI FT232 / CMSIS-DAP (0d28:0204)</text>
      <text x="15" y="145" class="flow-text">🔑 绑定 uucp/dialout 组 (MODE="0666")</text>
    </g>

    <!-- Runtime & Compiler Layer -->
    <g transform="translate(430, 0)">
      <rect width="670" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="670" height="32" rx="10" fill="#dcfce7" />
      <text x="20" y="21" class="box-label" fill="#166534">层级 3: 嵌入式编译工具链与 Python 3.12 虚拟环境</text>

      <g transform="translate(20, 45)">
        <rect width="300" height="165" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
        <text x="15" y="25" class="card-title">⚙️ ESP-IDF v5.4.4 LTS</text>
        <text x="15" y="50" class="card-desc">▪ 路径: ~/esp/esp-idf</text>
        <text x="15" y="72" class="card-desc">▪ 快速加载器: source get_idf</text>
        <text x="15" y="94" class="card-desc">▪ 构建引擎: CMake 3.31 + Ninja</text>
        <text x="15" y="116" class="card-desc">▪ FreeRTOS v10.5.1 内核</text>
        <text x="15" y="145" class="flow-text">📦 预置 esp32s3_starter 完整模板</text>
      </g>

      <g transform="translate(340, 45)">
        <rect width="310" height="165" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
        <text x="15" y="25" class="card-title">🐍 隔离 Python 3.12 运行时</text>
        <text x="15" y="50" class="card-desc">▪ 规避 Arch 默认 Python 3.14 轮子冲突</text>
        <text x="15" y="72" class="card-desc">▪ Xtensa GCC 14.2.0 (esp-14.2.0)</text>
        <text x="15" y="94" class="card-desc">▪ esptool v5.5.0 固件烧录器</text>
        <text x="15" y="116" class="card-desc">▪ OpenOCD-ESP32 硬件断点调试</text>
        <text x="15" y="145" class="flow-text">⚡ 冒烟测试全自动验证编译有效性</text>
      </g>
    </g>
  </g>

  <!-- Layer 4: Physical Hardware & Bus Connections -->
  <g transform="translate(50, 535)">
    <rect width="1100" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="1100" height="32" rx="10" fill="#fef3c7" />
    <text x="20" y="21" class="box-label" fill="#92400e">层级 4 &amp; 5: 物理硬件总线通信、固件运行时与外设驱动</text>

    <!-- Target Hardware Card -->
    <g transform="translate(20, 45)">
      <rect width="520" height="175" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="15" y="25" class="card-title">🎯 目标板: ESP32-S3-WROOM-1 / DevKitC-1</text>
      <text x="15" y="50" class="card-desc">▪ 核心架构: Xtensa 双核 32 位 LX7 @ 240MHz + 矢量扩展 (AI 加速)</text>
      <text x="15" y="72" class="card-desc">▪ 存储规格: 8MB Quad SPI Flash (80MHz) + 可选 2MB/8MB Octal PSRAM</text>
      <text x="15" y="94" class="card-desc">▪ 无线支持: 2.4 GHz Wi-Fi 802.11 b/g/n + Bluetooth 5.0 (LE / Mesh)</text>
      <text x="15" y="116" class="card-desc">▪ 原生 USB: GPIO19 (D-) / GPIO20 (D+) 硬件免额外芯片直连</text>
      <text x="15" y="145" class="flow-text">⚡ 遥测任务输出: 3.3V 模拟电压、片内测温、动态堆内存监控</text>
    </g>

    <!-- Peripheral & Display Card -->
    <g transform="translate(560, 45)">
      <rect width="520" height="175" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="15" y="25" class="card-title">📟 传感器、屏幕与外设总线交互 (hardware_matrix.json)</text>
      <text x="15" y="50" class="card-desc">▪ 屏幕显示: 1.3 英寸 ST7789 (SPI, 240x240) / SH1106 (I2C 128x64)</text>
      <text x="15" y="72" class="card-desc">▪ 串口数据流: /dev/ttyACM0 (原生 CDC) 与 /dev/ttyUSB0 (UART 桥)</text>
      <text x="15" y="94" class="card-desc">▪ VOFA+ 协议: FireWater 格式 &lt;var1,var2,...&gt;\n 实时生成波形曲线</text>
      <text x="15" y="116" class="card-desc">▪ 硬件调试: JTAG 硬件断点 (支持 VS Code 断点单步与寄存器监视)</text>
      <text x="15" y="145" class="flow-text">📈 完美支撑生产级 IoT 物联网边缘设备与图形化界面开发</text>
    </g>
  </g>
</svg>
